<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ARC Raiders Master Cheat Sheet (Interactive)</title>
  <meta name="description" content="Interactive, searchable ARC Raiders cheat sheet." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
<div class="topbarRow">
  <div class="brand">
    <div class="logo" aria-hidden="true"></div>
    <div>
      <div class="title">ARC Raiders Cheat Sheet</div>
      <div class="subtitle">Interactive • Filter • WIP</div>
    </div>
  </div>

  <a
  href="https://discord.gg/6db7Kg8Wre"
  class="discord-btn"
  target="_blank"
  rel="noopener"
  aria-label="Join Discord"
></a>
</div>

    <div class="controls">
      <label class="control">
        <input id="q" type="search" placeholder="Search: e.g., Cooling Coil, Magnetic Accelerator…" autocomplete="off" />
      </label>

      <label class="control">
        <span>Section</span>
        <select id="section"></select>
      </label>

      <label class="control">
        <span>Category</span>
        <select id="category"></select>
      </label>

      <label class="control">
        <span>Sort</span>
        <select id="sort">
          <option value="name-asc">Name (A→Z)</option>
          <option value="value-desc">Sell Value (high→low)</option>
          <option value="value-asc">Sell Value (low→high)</option>
          <option value="delta-desc">Recycle ▲% (high→low)</option>
          <option value="delta-asc">Recycle ▼% (low→high)</option>
        </select>
      </label>

      <button id="reset" class="btn" type="button">Reset</button>
    </div>
  </header>

  <main class="container">
    <section class="stats" aria-live="polite">
      <div class="pill"><span id="count">0</span> items</div>
    </section>

    <section id="grid" class="grid" aria-label="Items list"></section>

    <footer class="footer">
      <div>Original by u/pRoDeeD, GitHub by .saltea</div>
      <div class="muted">If anything is wrong or missing please let me know via Discord @ .saltea</div>
    </footer>
  </main>

<template id="cardTpl">
  <article class="card">
    <div class="cardTop">
  <div class="name"></div>

  <div class="topBadges">
    <div class="badge"></div>
    <span class="tag rarity"></span>
  </div>
</div>


<div class="metaWrap">
  <div class="meta">
    <div class="metaRow">
      <span class="label">Sell</span>
      <span class="value sell"></span>
    </div>
  </div>

  <div class="icon"></div>
</div>

<div class="tags">
  <span class="tag section"></span>
  <span class="tag category"></span>
</div>
  </article>
</template>

  <script src="app.js"></script>
</body>
</html>
